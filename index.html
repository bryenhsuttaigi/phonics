<main>
  <div class="pagehead">
    <h1 class="title"><span>總　目</span></h1>
    <p class="eyebrow">CONTENTS</p>
  </div>
  <p class="subline">兩條戰線：<b>音標</b>，<b>用字</b>。</p>

  <a class="card" href="/phonics/">
    <h2>閩南語拼音法</h2>
    <p>三組：<b>注音版</b>（會 ㄅㄆㄇ 就會）、<b>美拼版</b>（完整・一般・速查卡）、<b>English</b>——最後這組不是中文版的翻譯，是另外寫給英語的耳朵讀的。</p>
    <p>不必先學一套新符號，一般英數鍵盤就打得出所有拼音；聲調交給音樂耳朵。</p>
    <span class="tag">注音版・美拼版・English</span>
  </a>

  <div class="card soon">
    <h2>甲骨釋文</h2>
    <p>用字這一案。從一個人、一個場景說起，把字寫回它原本的生活裡。</p>
    <p class="teaser">先看這個字原本畫的是什麼，再看是誰把它換掉了。<br>首篇預告：〈烏鳩〉。</p>
    <span class="tag">籌備中</span>
